# 知识图谱后端示例编排：LightRAG（图谱服务）+ Neo4j（图存储）
# 默认不随 deploy/compose.yaml 启动；按 README 手动启用。
# 注意：LightRAG 镜像与版本以官方发布为准，请按需替换 IMAGE 与模型相关环境变量。
services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: ragent-lightrag
    ports:
      - "9621:9621"
    environment:
      # 图存储使用 Neo4j；实体抽取用的 LLM / embedding 由部署方按需配置
      LIGHTRAG_KV_STORAGE: Neo4JStorage
      LIGHTRAG_DOC_STATUS_STORAGE: JsonDocStatusStorage
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ragent-graph}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
    volumes:
      - lightrag-data:/app/data
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: ragent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ragent-graph}
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  lightrag-data:
  neo4j-data:
