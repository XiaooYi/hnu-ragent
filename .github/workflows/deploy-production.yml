name: Build and deploy to Tencent CVM

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: hnu-ragent-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: deploy/backend.Dockerfile
          - service: mcp-server
            dockerfile: deploy/mcp-server.Dockerfile
          - service: frontend
            dockerfile: deploy/frontend.Dockerfile

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/ragent-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=ragent-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ragent-${{ matrix.service }}

  deploy:
    name: Pull images and update application containers
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, ragent-prod]
    timeout-minutes: 20

    steps:
      # github.com is unreachable from this CVM, but api.github.com is. Fetch
      # only small deployment files from the exact commit; compilation happens
      # on the GitHub-hosted runner above.
      - name: Fetch deployment files, pull images, and restart applications
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          RAGENT_DEPLOY_ENV_FILE: /home/ubuntu/ragent-secrets/ragent.env
        run: |
          set -Eeuo pipefail
          deploy_root="$RUNNER_TEMP/ragent-deploy/$GITHUB_SHA"
          auth_config="$RUNNER_TEMP/ragent-curl-auth.config"

          umask 077
          mkdir -p "$deploy_root/deploy/rocketmq" "$deploy_root/resources/database"
          printf '%s\n' \
            "header = \"Authorization: Bearer $GITHUB_TOKEN\"" \
            'header = "Accept: application/vnd.github.raw+json"' \
            > "$auth_config"
          trap 'docker logout "$TCR_REGISTRY" >/dev/null 2>&1 || true; rm -f "$auth_config"' EXIT

          fetch_file() {
            local repository_path="$1"
            local output_path="$2"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --config "$auth_config" \
              --output "$output_path" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${repository_path}?ref=${GITHUB_SHA}"
          }

          fetch_file deploy/compose.yaml "$deploy_root/deploy/compose.yaml"
          fetch_file deploy/deploy-from-registry.sh "$deploy_root/deploy/deploy-from-registry.sh"
          fetch_file deploy/rocketmq/broker.conf "$deploy_root/deploy/rocketmq/broker.conf"
          fetch_file resources/database/schema_pg.sql "$deploy_root/resources/database/schema_pg.sql"
          fetch_file resources/database/init_data_pg.sql "$deploy_root/resources/database/init_data_pg.sql"
          chmod 700 "$deploy_root/deploy/deploy-from-registry.sh"

          printf '%s' "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" \
            --username "$TCR_USERNAME" --password-stdin

          export RAGENT_BACKEND_IMAGE="$TCR_REGISTRY/$TCR_NAMESPACE/ragent-backend:$GITHUB_SHA"
          export RAGENT_MCP_IMAGE="$TCR_REGISTRY/$TCR_NAMESPACE/ragent-mcp-server:$GITHUB_SHA"
          export RAGENT_FRONTEND_IMAGE="$TCR_REGISTRY/$TCR_NAMESPACE/ragent-frontend:$GITHUB_SHA"
          export RAGENT_COMPOSE_FILE="$deploy_root/deploy/compose.yaml"

          bash "$deploy_root/deploy/deploy-from-registry.sh"
