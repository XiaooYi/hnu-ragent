# 湖大校内场景示例数据集
# collection-name 是幂等键：初始化器按它判定知识库是否已存在
# embedding-model 必须与 ai.embedding 候选中的 id 一致（默认 qwen3.7-text-embedding）
name=湖大校内制度示例库
collection-name=hnu_demo_store
embedding-model=qwen3.7-text-embedding
docs-dir=resources/initializer/hnu/docs
# 意图节点 code 前缀：清理时只删这个前缀的节点，避免误伤自建意图
intent-code-prefix=init_
