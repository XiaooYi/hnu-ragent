server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://192.168.227.128:5432/ragent?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 192.168.227.128
      port: 6379
      password: 123456

rocketmq:
  name-server: 192.168.227.128:9876
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000

milvus:
  uri: http://192.168.227.128:19530

# 场景初始化器：一键装入「知识库 + 示例文档 + 示例问题 + 示例意图树」
# 默认关闭；打开一次执行完就应关回 false（它会写业务表）
initializer:
  enabled: false
  scenario: hnu          # 对应 resources/initializer/<scenario>/
  mode: seed             # seed（灌数据）/ cleanup（清理该数据集写入的数据）
  fail-fast: true        # 任一步失败即中断，配置错误尽早暴露

rag:
  vector:
    type: pg  # 可选 milvus / pg

  # 关键词检索（混合检索的第二路召回）
  # none：不引入 ES 连接，检索通道与融合处理器都不注册，与纯向量检索等价
  # es：启用 ES 关键词通道，需要可用的 Elasticsearch 与 IK 分词插件
  keyword:
    type: none  # 可选 none / es
    es:
      uris: http://127.0.0.1:9200
      index: rag_keyword_store   # 全部知识库共用的物理索引，按 collection_name 字段区分
      analyzer: ik_max_word      # 写入分词器（需安装 IK 插件）
      search-analyzer: ik_smart  # 查询分词器（需安装 IK 插件）

  # 知识图谱检索（LightRAG 微服务：实体/关系抽取与图存储都在服务侧，本仓库不直连 Neo4j）
  # none：不注册图谱客户端、图谱通道与写入同步装饰器，与「从未引入图谱」运行期等价
  # lightrag：启用图谱后端，写入向量时同步维护图谱，并可按 rag.search.channels.graph.enabled 开启图谱召回
  graph:
    type: none  # 可选 none / lightrag
    embedding-model: ""  # 图谱侧 embedding 模型标识（服务端配置为准，此处仅作记录）
    lightrag:
      base-url: http://127.0.0.1:9621
      api-key: ${LIGHTRAG_API_KEY:}  # 本地部署可留空；留空则不发送 X-API-Key 头
      query-mode: hybrid  # naive / local / global / hybrid / mix；hybrid 只回图结构关联的证据，与向量/关键词正交

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true

  rerank:
    enabled: true

  citation:
    enabled: true  # 回答行内引用角标 [N](#cite-N)：开启会动态追加引用规则并为资料注入编号，增加首字延迟；关闭不影响文档级来源面板

  # 上下文组装：回表补齐文档归属（文档ID/序号/标题），并按文档聚合
  # 关闭后退回「按相关性平铺、不带来源」的旧行为
  context:
    enrich:
      enabled: true

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    summary-max-chars: 200
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://192.168.227.128:9099

  search:
    scope:
      recall-budget: 0  # 通道取数深度（候选池大小）；<=0 时跟随 fusion.rerank-candidate-limit（单一真源）
    channels:
      timeout-ms: 15000  # 单通道超时上限；超时通道按空结果降级，<=0 不限时（退回等最慢通道）
      vector-global:
        confidence-threshold: 0.6
      intent-directed:
        enabled: true
        min-intent-score: 0.4
      # 关键词检索通道（仅当 rag.keyword.type=es 时该通道才存在）
      keyword:
        enabled: false  # 置 true 前必须先把 rag.keyword.type 设为 es，否则启动校验会直接拦截
        mode: both  # 可选 global / intent / both
      # 联网检索通道（You.com Search）：与本地知识库通道互补，覆盖时效性/公开资讯类问题
      # 启用条件：enabled=true 且能读到 API Key（api-key 非空，或环境变量 YDC_API_KEY），缺一通道不生效
      # 失败语义：超时 / 非 2xx / 响应异常一律降级为空结果，不影响本地检索
      web-search:
        enabled: false
        count: 5  # 返回结果总条数上限（网页 + 新闻合并后截断），最大 20
        timeout-seconds: 10
        api-key: ${YDC_API_KEY:}  # 建议走环境变量，不要把明文 Key 写进配置
        api-url: https://ydc-index.io/v1/search
      # 图谱检索通道（仅当 rag.graph.type=lightrag 时该通道才存在）
      graph:
        enabled: false  # 置 true 前必须先把 rag.graph.type 设为 lightrag，否则启动校验会直接拦截
        mode: both  # 可选 global / intent / both

    # 多通道结果融合：向量分与关键词分量纲不同，用 RRF 按名次融合
    fusion:
      strategy: rrf
      rrf-k: 60
      rerank-candidate-limit: 50  # RRF 融合后送入 Rerank 的候选上限，<=0 不截断（经验值 40~100）

    # 证据相关性闸门：检索只保证返回最像的 N 条，库里没答案时照样满额返回，这里补一道相关度下限
    evidence:
      min-rerank-score: 0.2   # 整批最高精排分低于此值则整批丢弃，0=关闭；随 reranker 而变，换模型看「检索归因 - 精排分布」重测

  trace:
    enabled: true
    max-error-length: 1000
    # LangFuse 上报（可选，默认关闭）：本地 trace 表负责单机排障，LangFuse 负责跨服务可视化
    langfuse:
      enabled: false
      host: ""                 # 如 https://cloud.langfuse.com
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      environment: default
      timeout-ms: 3000
      agent-enabled: true      # 是否连 Agent 运行（含工具步骤）一起上报

  # 图片解析（图生文）配置
  # 产出一段自包含的知识文本：既说清"图是什么"，又完整保留所有文字与层级
  image-parse:
    description-prompt: |-
      请把这张图片的内容转写成一段自包含的知识文本，用于知识库检索与问答，不要描述颜色、布局、字体等视觉样式。要求：
      1. 开头用一两句话说明这张图是什么（主题、类型、用途），让人不看图也能明白讲的是什么。
      2. 随后按图中的分组、层级、流程关系，完整转写所有文字内容（OCR），保留每个分组标题与其下属条目的归属关系，不要遗漏任何文字。
      3. 若是图表、架构图或流程图，请补充说明各部分之间的关系（如包含、调用、先后顺序），而不只是罗列文字。
      4. 保持术语准确完整，表述贴近用户可能的提问方式。
      5. 最后另起一行，用一句话自然引出图片（例如"下方为该内容对应的原始图片："），以便在这段文字后紧接着展示图片。
    max-output-tokens: 4096

ai:
  # Agent 运行时（ReAct 引擎 + 工具目录）
  # 默认关闭：不注册引擎 bean，RAG 链路行为与「未引入 Agent」完全一致
  agent:
    enabled: false
    max-steps: 6        # 单轮最多几次「想 + 调工具」，超出后用最后一次观察收口
    temperature: 0.2
    top-p: 0.3
    allowed-tools: []   # 空表示目录内全部可用；可写 [ knowledge_search, youcom_search ] 收窄
    max-observation-chars: 4000  # 单次工具结果截断长度，避免观察结果撑爆上下文
    # 长期记忆：跨会话保留用户事实（偏好/背景/约束）。默认关闭——抽取要多调一次模型，且写错比不写更糟
    memory:
      enabled: false
      recall-limit: 5        # 单轮最多注入几条记忆
      max-facts-per-turn: 3  # 单轮最多沉淀几条新事实
    # 技能手册：classpath 下 agent/skills/*.md，触发词命中时注入提示词（静态文本，无额外模型调用）
    skills:
      enabled: true
      max-skills: 2          # 单轮最多注入几份手册
      location: classpath*:agent/skills/*.md
    # 声明为只读的工具 id：本地工具会自行声明，这里主要给 MCP 工具用
    # MCP 协议无法表达读写属性，默认一律按写操作处理（每次调用都要人工确认）
    read-only-tools: [ youcom_search ]
    # 写操作确认：默认开启（默认拒绝语义），关闭等于允许模型自主写数据
    confirm:
      required: true
    # 多轮上下文：保留最近若干轮完整问答，更早的轮次压成「仅问题」摘要，整体受字符预算约束
    history:
      enabled: true
      keep-turns: 4
      max-chars: 2000

  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: sk-ws-H.RYXEYMP.e8JH.MEUCIFP8iCvcKiAKaJ9gdOIjvHhDB64375YSFhvwlRMlnEEHAiEAjpo34waqzk9hWwRR9wBKVG1dYPym9CbHAd-JKgMuh8o
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    aihubmix:
      url: https://aihubmix.com
      api-key: ${AIHUBMIX_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: sk-uiewylrvhdhvbxzrptealdjgitakaqanscgrcnwxpljjnhtr
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    # DeepSeek 官方开放平台：思考开关走 thinking 对象方言
    # 默认不参与模型路由，启用需设置 DEEPSEEK_API_KEY 并把它加入 ai.chat.tiers.*.candidates
    deepseek:
      url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      endpoints:
        chat: /v1/chat/completions

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen-plus
    deep-thinking-model: qwen3-max
    default-tier: standard
    deep-thinking-tier: deep
    # 档位 = 质量/成本/时延预算：调用点按任务性质选档，路由只在档位内选候选
    tiers:
      fast:
        candidates: [ qwen3-local, qwen-plus ]
        timeout-ms: 5000    # 高频小任务：短预算，快速失败后换候选
      standard:
        candidates: [ qwen3-max, qwen-plus, qwen3-local ]  # 首位放能力最强的模型，其余为降级候选
        timeout-ms: 120000
      deep:
        candidates: [ qwen3-max, glm-4.7 ]
        timeout-ms: 180000
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 1
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
        priority: 2
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 3
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 4
      - id: gpt-5.4
        provider: aihubmix
        model: gpt-5.4
        priority: 5
      # DeepSeek 候选：默认不被任何档位引用（需设置 DEEPSEEK_API_KEY 并加入 ai.chat.tiers.*.candidates 才参与路由）
      - id: deepseek-chat
        provider: deepseek
        model: deepseek-chat
        supports-thinking: true
        priority: 6

  embedding:
    default-model: qwen3.7-text-embedding
    candidates:
      - id: qwen3.7-text-embedding
        provider: bailian
        model: qwen3.7-text-embedding
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 2
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 3
      - id: text-embedding-3-large
        provider: aihubmix
        model: text-embedding-3-large
        dimension: ${rag.default.dimension}
        priority: 4

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  vlm:
    default-model: qwen-vl-max
    candidates:
      - id: qwen-vl-max
        provider: bailian
        model: qwen-vl-max

